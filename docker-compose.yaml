version: '3'

services:
  postgres:
    image: postgres:14.2
    container_name: postgres
    command: -c 'max_connections=300'
    shm_size: 1g
    restart: always
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - ./.data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      TZ: Asia/Jakarta'
      PGTZ: Asia/Jakarta

  adminer:
    image: adminer
    container_name: adminer_biosron
    restart: always
    ports:
      - 8080:8080
    environment:
      TZ: Asia/Jakarta'
      PGTZ: Asia/Jakarta
